<!doctype html>
<!--
  The Hypergraph Project video end card, house style 1.0.0. Hold it for 8 seconds at the end of the video.

  Fill it through the address. Lists are comma-separated display names, exactly as each person
  wants to be credited. Leave out any line that has nobody in it.
    end-card.html?title=The%20law%20of%20large%20numbers&notes=Ada%20Example&review=Ben%20Example,Chi%20Example&video=Ada%20Example&animation=Dee%20Example&url=thehypergraphproject.org/tracks/probability-statistics/limit-theorems

  Render to PNG:
    chrome --headless=new --hide-scrollbars --window-size=1920,1080 --screenshot=video/cards/end.png "file:///full/path/end-card.html?..."
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>End card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&family=Geist+Pixel&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr auto;
        gap: 4vw;
        padding: 5vw;
        box-sizing: border-box;
        overflow: hidden;
        background: #0f0f0f;
        color: #f5f5f4;
        font-family: "Geist", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .lead { align-self: start; margin: 0; }
      .title { margin: 0 0 2vw; font-size: 3.6vw; font-weight: 500; line-height: 1.05; letter-spacing: -0.03em; }
      .free { margin: 0; font-size: 1.8vw; color: #a3a3a1; }
      .url { margin: 0.6vw 0 0; font-family: "Geist Mono", monospace; font-size: 1.8vw; }
      .credits { align-self: start; display: grid; gap: 1.8vw; margin: 0; }
      .credits div { display: grid; grid-template-columns: 11vw 1fr; gap: 1.6vw; font-size: 1.9vw; }
      .credits dt { color: #a3a3a1; }
      .credits dd { margin: 0; }
      .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; font-family: "Geist Mono", monospace; font-size: 1.5vw; color: #a3a3a1; }
      .mark { font-family: "Geist Pixel", "Geist Mono", monospace; font-size: 2vw; color: #f5f5f4; }
    </style>
  </head>
  <body>
    <div class="lead">
      <h1 class="title" id="title">The law of large numbers</h1>
      <p class="free">Notes, exercises and simulations, free:</p>
      <p class="url" id="url">thehypergraphproject.org</p>
    </div>
    <dl class="credits" id="credits"></dl>
    <p class="foot"><span class="mark">The Hypergraph Project</span><span>CC BY-SA 4.0</span></p>
    <script>
      const q = new URLSearchParams(location.search);
      if (q.get("title")) document.getElementById("title").textContent = q.get("title");
      if (q.get("url")) document.getElementById("url").textContent = q.get("url");
      const rows = [
        ["notes", "Notes"],
        ["review", "Reviewed by"],
        ["video", "Video"],
        ["animation", "Animation"],
        ["narration", "Narration"],
      ];
      const list = document.getElementById("credits");
      for (const [key, name] of rows) {
        const people = (q.get(key) || "").split(",").map((s) => s.trim()).filter(Boolean);
        if (!people.length) continue;
        const row = document.createElement("div");
        const dt = document.createElement("dt");
        const dd = document.createElement("dd");
        dt.textContent = name;
        dd.textContent = people.join(", ");
        row.append(dt, dd);
        list.append(row);
      }
    </script>
  </body>
</html>
